<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ORB — Painel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f7f7fb;color:#16161a}
    .app{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}.orb{width:34px;height:34px;border-radius:50%;background:#17171b;position:relative}.orb:after{content:"";position:absolute;left:-6px;right:-6px;top:14px;height:7px;border-radius:50%;background:linear-gradient(90deg,#a855f7,#4f6df5);transform:rotate(-10deg)}
    .muted{color:#737380;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.metric{background:#17171b;color:white;border-radius:16px;padding:14px}.metric b{display:block;font-size:22px}.metric small{opacity:.65}
    .toolbar{display:flex;gap:10px;margin:14px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #ddddea;border-radius:12px;background:white;font-size:14px}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .card{background:white;border:1px solid #e7e7ef;border-radius:18px;padding:17px}.row{display:flex;justify-content:space-between;gap:12px}.score{background:#f3ecff;color:#6d31d9;border-radius:999px;padding:7px 10px;font-weight:800}.time{font-weight:900;font-size:19px}.title{font-weight:800;margin:14px 0;line-height:1.35}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#f2f2f6;border-radius:999px;padding:5px 8px;font-size:11px}.price{display:flex;align-items:center;gap:9px;margin:16px 0}.old{text-decoration:line-through;color:#9a9aa4}.now{font-size:25px;font-weight:900}.disc{background:#dcfce7;color:#166534;padding:5px 7px;border-radius:8px;font-weight:800}.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}.actions button,.logout{border:0;border-radius:11px;padding:11px;font-weight:800;cursor:pointer}.copy{background:#17171b;color:white}.open{background:#ececf4}.login{max-width:380px;margin:12vh auto;background:white;border:1px solid #e7e7ef;border-radius:20px;padding:22px}.login input{width:100%;padding:12px;border:1px solid #ddddea;border-radius:12px;margin-top:8px}.login button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:#17171b;color:#fff;font-weight:800}.error{color:#b42318;font-size:13px;margin-top:10px}.hidden{display:none!important}
    @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.top{align-items:flex-start}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <section id="loginView" class="login">
    <div class="brand"><span class="orb"></span> ORB</div>
    <p class="muted">Painel privado de promoções</p>
    <input id="email" type="email" placeholder="E-mail" autocomplete="username" />
    <input id="password" type="password" placeholder="Senha" autocomplete="current-password" />
    <button id="loginBtn">Entrar</button>
    <div id="loginError" class="error"></div>
  </section>

  <main id="appView" class="app hidden">
    <div class="top">
      <div><div class="brand"><span class="orb"></span> ORB <span style="font-weight:500">Painel</span></div><div id="updated" class="muted"></div></div>
      <button id="logoutBtn" class="logout">Sair</button>
    </div>
    <div class="cards">
      <div class="metric"><b id="mRows">—</b><small>linhas</small></div>
      <div class="metric"><b id="mUnique">—</b><small>produtos únicos</small></div>
      <div class="metric"><b id="mCandidates">—</b><small>candidatos</small></div>
      <div class="metric"><b id="mQueue">—</b><small>ofertas na fila</small></div>
    </div>
    <div class="toolbar"><input id="search" placeholder="Buscar produto..." /><select id="cat"><option value="">Todas categorias</option></select></div>
    <section id="grid" class="grid"></section>
  </main>

<script>
const C=window.ORB_CONFIG||{};
const sb=supabase.createClient(C.supabaseUrl,C.supabasePublishableKey);
const loginView=document.getElementById('loginView'), appView=document.getElementById('appView');
let offers=[];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
async function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');await loadData();}
async function login(){document.getElementById('loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){document.getElementById('loginError').textContent='Login inválido.';return;}showApp();}
async function loadData(){const {data,error}=await sb.storage.from(C.panelBucket||'orb-panel').download('latest.json');if(error){document.getElementById('updated').textContent='Ainda não há dados publicados.';return;}const j=JSON.parse(await data.text());offers=j.offers||[];mRows.textContent=(j.stats?.total_rows||0).toLocaleString('pt-BR');mUnique.textContent=(j.stats?.unique_items||0).toLocaleString('pt-BR');mCandidates.textContent=(j.stats?.candidates||0).toLocaleString('pt-BR');mQueue.textContent=(j.stats?.queue||offers.length).toLocaleString('pt-BR');updated.textContent='Atualizado em '+new Date(j.generated_at).toLocaleString('pt-BR');const cats=[...new Set(offers.map(o=>o.categoria).filter(Boolean))].sort();cat.innerHTML='<option value="">Todas categorias</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');render();}
function render(){const q=search.value.toLowerCase().trim(),c=cat.value;const list=offers.filter(o=>(!q||o.produto.toLowerCase().includes(q))&&(!c||o.categoria===c));grid.innerHTML=list.map(o=>`<article class="card"><div class="row"><span class="time">${esc(o.hora_sugerida)}</span><span class="score">🔥 ${Math.round(o.score)}</span></div><div class="title">${esc(o.produto)}</div><div class="pills"><span class="pill">${esc(o.categoria)}</span><span class="pill">⭐ ${Number(o.nota_produto||0).toFixed(2)}</span>${o.likes?`<span class="pill">❤️ ${Number(o.likes).toLocaleString('pt-BR')}</span>`:''}</div><div class="price"><span class="old">${money(o.preco_normal)}</span><span class="now">${money(o.preco_agora)}</span><span class="disc">-${Math.round(o.desconto_pct)}%</span></div><div class="actions"><button class="copy" data-copy="${encodeURIComponent(o.copy_pronta)}">📋 COPIAR POST</button><button class="open" data-url="${esc(o.link_afiliado)}">🔗 ABRIR</button></div></article>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy))));document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>window.open(b.dataset.url,'_blank')));}
loginBtn.addEventListener('click',login);password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});logoutBtn.addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});search.addEventListener('input',render);cat.addEventListener('change',render);
(async()=>{const {data}=await sb.auth.getSession();if(data.session)showApp();})();
</script>
</body>
</html>
